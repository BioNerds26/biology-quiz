<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BioNerds Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column. Password screen first, then quiz editor, then the list of saved quizzes. */
:root {
  --bg: #081423; --surface: #0f2236; --ink: #e8f1f7; --muted: #8fa6b8; --line: #1f3a52;
  --accent: #22d67f; --accent-ink: #04210f; --bad: #ff8a78; --good: #3ddc8b;
  --display: "Sora", "Trebuchet MS", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  background-image: radial-gradient(900px 420px at 85% -80px, #0f3b3a 0%, transparent 70%);
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 20px; }
.hexicon { width: 26px; height: 24px; background: var(--accent); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.tag { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 36px); }
h2 { font-size: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, .lbl { font-weight: 600; font-size: 14px; }
input[type="text"], input[type="password"], textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 11px 13px; width: 100%; min-height: 46px;
}
textarea { min-height: 76px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 12px 20px; min-height: 46px; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
.btn.sm { padding: 8px 14px; min-height: 38px; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { margin: 0; font-size: 14px; min-height: 20px; color: var(--muted); }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); }
.qblock { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opt { display: flex; align-items: center; gap: 10px; }
.opt .letter { font-family: var(--mono); color: var(--muted); width: 1.5ch; flex: none; }
.opt input[type="radio"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.opt input[type="text"] { flex: 1; min-width: 0; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.qrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.qrow:first-child { border-top: 0; }
.qrow b { overflow-wrap: anywhere; }
.qrow small { display: block; color: var(--muted); font-family: var(--mono); }
select { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 13px; min-height: 46px; width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="hexicon" aria-hidden="true"></span>BioNerds admin</div>

  <section class="card" id="login">
    <span class="tag">Teacher only</span>
    <h1>Admin sign in</h1>
    <div class="field">
      <label for="pw">Admin password</label>
      <input type="password" id="pw" autocomplete="current-password">
    </div>
    <p class="msg" id="login-msg" role="alert"></p>
    <div class="row"><button class="btn" type="button" id="login-btn">Sign in</button></div>
  </section>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:20px">
    <section class="card">
      <span class="tag">New quiz</span>
      <h1 id="editor-title">Add a quiz</h1>
      <div id="edit-banner" class="row" hidden style="justify-content:space-between"><span class="msg" id="edit-label"></span><button type="button" class="btn ghost sm" id="cancel-edit">Cancel edit</button></div>
      <div class="field">
        <label for="title">Quiz title</label>
        <input type="text" id="title" placeholder="e.g. IGCSE Biology Topic 2: Cells" maxlength="120">
      </div>
      <div id="questions" style="display:flex;flex-direction:column;gap:14px"></div>
      <div class="row">
        <button class="btn ghost" type="button" id="add-q">Add question</button>
        <button class="btn" type="button" id="save">Save quiz</button>
      </div>
      <p class="msg" id="save-msg" role="status"></p>
    </section>

    <section class="card">
      <h2>Saved quizzes</h2>
      <div id="list"><p class="msg">Loading…</p></div>
      <p class="msg" id="list-msg"></p>
    </section>
  </div>
</div>

<script>
/* Same Google Apps Script web app address as the student page. */
var SHEET_URL = "https://script.google.com/macros/s/AKfycbyEgbBQxV5QSel5UCFubSlF4TGtGb0_zZYVJR55GD02yIDrcDI7nBUT_Ir8TGXZwSyc/exec";
var LETTERS = ["A", "B", "C", "D"];
var pw = "";
var qCount = 0;
var editing = null;
var BUILTIN_QUIZ = { title: "IGCSE Biology Topic 1", questions: [
  { q: "Which of the following is NOT a characteristic shared by all living organisms?", o: ["Respiration", "Photosynthesis", "Excretion", "Growth"], a: 1,
    e: "The seven characteristics are movement, respiration, sensitivity, growth, reproduction, excretion and nutrition (MRS GREN). Only plants and some bacteria photosynthesise." },
  { q: "What is the term for the removal of toxic materials and waste products of metabolism from an organism?", o: ["Egestion", "Secretion", "Excretion", "Respiration"], a: 2,
    e: "Excretion removes metabolic waste (e.g. CO₂, urea). Egestion is the removal of undigested food." },
  { q: "In the binomial name Homo sapiens, what does the first word, Homo, represent?", o: ["The species", "The family", "The kingdom", "The genus"], a: 3,
    e: "A binomial name has two parts: the genus (capital first letter) followed by the species (all lower case)." },
  { q: "Which is the best definition of a species?", o: ["A group of organisms that look identical", "A group of organisms that can reproduce to produce fertile offspring", "A group of organisms living in the same habitat", "A group of organisms that share the same genus"], a: 1,
    e: "A species is a group of organisms that can reproduce to produce fertile offspring. A mule is infertile because horses and donkeys are different species." },
  { q: "Which list shows the classification groups in order from largest to smallest?", o: ["Kingdom, phylum, class, order, family, genus, species", "Kingdom, class, phylum, order, genus, family, species", "Species, genus, family, order, class, phylum, kingdom", "Phylum, kingdom, class, order, family, genus, species"], a: 0,
    e: "Kingdom, Phylum, Class, Order, Family, Genus, Species." },
  { q: "Which feature is found in mammals but NOT in the other vertebrate groups?", o: ["Lungs for gas exchange", "A backbone", "Mammary glands that produce milk", "Internal fertilisation"], a: 2,
    e: "Mammals have hair/fur and mammary glands, and most give birth to live young." },
  { q: "A vertebrate has moist skin and lays soft eggs without shells in water. To which group does it belong?", o: ["Reptiles", "Fish", "Amphibians", "Birds"], a: 2,
    e: "Amphibians have moist, permeable skin and lay shell-less eggs in water. Reptiles have dry scaly skin and lay leathery-shelled eggs on land." },
  { q: "Which group of arthropods has three body parts and six legs?", o: ["Arachnids", "Insects", "Crustaceans", "Myriapods"], a: 1,
    e: "Insects have a head, thorax and abdomen, plus three pairs of legs." },
  { q: "A spider has two body parts and eight legs. To which group of arthropods does it belong?", o: ["Insects", "Crustaceans", "Myriapods", "Arachnids"], a: 3,
    e: "Arachnids (spiders, scorpions, ticks) have two body parts and four pairs of legs." },
  { q: "Which feature is typical of a monocotyledon?", o: ["Net-like veins in the leaves", "Two seed leaves (cotyledons)", "Parallel veins in the leaves", "Flower parts in fours or fives"], a: 2,
    e: "Monocots (e.g. grass, maize) have one cotyledon and parallel leaf veins. Dicots have two cotyledons and net-like veins." },
  { q: "Which group of plants has roots, stems and leaves (fronds) but reproduces using spores and does not produce flowers?", o: ["Ferns", "Flowering plants", "Algae", "Fungi"], a: 0,
    e: "Ferns reproduce by spores and have fronds. Flowering plants reproduce by seeds, and fungi are not plants." },
  { q: "Which statement about fungi is correct?", o: ["They make food by photosynthesis", "Their bodies are made of thread-like hyphae forming a mycelium", "Their cell walls are made of cellulose", "They are all single-celled"], a: 1,
    e: "Most fungi are multicellular with hyphae forming a mycelium. They feed saprotrophically or parasitically and have chitin cell walls (yeast is a single-celled exception)." },
  { q: "Which statement about viruses is correct?", o: ["They have a nucleus and cytoplasm", "They can reproduce on their own outside a host", "They are made of cells with a cell membrane", "They have a protein coat and genetic material but no cell structure"], a: 3,
    e: "Viruses are not made of cells. They have a protein coat around genetic material and reproduce only inside host cells." },
  { q: "Which feature is found in bacterial cells?", o: ["A true nucleus surrounded by a membrane", "Chloroplasts in all cells", "Mitochondria", "A cell wall and circular DNA with no true nucleus"], a: 3,
    e: "Bacteria are prokaryotes: cell wall, cytoplasm and circular DNA (often plasmids) but no membrane-bound nucleus." },
  { q: "What is a dichotomous key used for?", o: ["Identifying organisms using a series of paired statements or questions", "Showing the energy flow between organisms", "Measuring the population size of a species", "Showing the evolutionary age of organisms"], a: 0,
    e: "A dichotomous key gives two choices at each step based on observable features, leading to the identity of the organism." }
] };

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
}
function setMsg(id, text, kind) { var el = $(id); el.textContent = text; el.className = "msg" + (kind ? " " + kind : ""); }

function api(params) {
  var u = new URL(SHEET_URL);
  Object.keys(params).forEach(function (k) { u.searchParams.set(k, params[k]); });
  u.searchParams.set("t", Date.now());
  return fetch(u.toString()).then(function (r) { return r.json(); });
}

/* The script cannot answer a form post, so a save is confirmed by reading the list again. */
function postForm(obj) {
  var frame = document.createElement("iframe");
  frame.name = "post-frame-" + Date.now() + Math.random().toString(36).slice(2, 6);
  frame.style.display = "none";
  document.body.appendChild(frame);
  var form = document.createElement("form");
  form.method = "POST"; form.action = SHEET_URL; form.target = frame.name; form.style.display = "none";
  var input = document.createElement("input");
  input.type = "hidden"; input.name = "payload"; input.value = JSON.stringify(obj);
  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  setTimeout(function () { form.remove(); frame.remove(); }, 30000);
}

function waitFor(test, tries) {
  return new Promise(function (resolve) {
    var n = 0;
    (function poll() {
      api({ action: "list" }).then(function (j) {
        var list = j && j.ok ? j.quizzes : null;
        if (list && test(list)) { resolve(list); return; }
        if (++n >= tries) { resolve(null); return; }
        setTimeout(poll, 1800);
      }).catch(function () {
        if (++n >= tries) { resolve(null); return; }
        setTimeout(poll, 1800);
      });
    })();
  });
}

/* sign in */
function signIn() {
  var p = $("pw").value;
  if (!p) { setMsg("login-msg", "Enter the admin password.", "bad"); return; }
  setMsg("login-msg", "Checking…");
  api({ action: "check", pw: p }).then(function (j) {
    if (j && j.ok) {
      pw = p;
      try { sessionStorage.setItem("bn_admin_pw", p); } catch (e) {}
      $("login").hidden = true;
      $("app").hidden = false;
      if (!qCount) addQuestion();
      refreshList();
    } else {
      setMsg("login-msg", "Wrong password, or the password is not set yet in the Google script.", "bad");
    }
  }).catch(function () {
    setMsg("login-msg", "Could not reach the server. Check your internet and the script address.", "bad");
  });
}
$("login-btn").addEventListener("click", signIn);
$("pw").addEventListener("keydown", function (ev) { if (ev.key === "Enter") signIn(); });

/* question editor */
function addQuestion(pre) {
  qCount++;
  var id = qCount;
  var div = document.createElement("div");
  div.className = "qblock";
  var opts = "";
  for (var i = 0; i < 4; i++) {
    opts += '<div class="opt"><input type="radio" name="correct' + id + '" value="' + i + '" aria-label="Correct answer ' + LETTERS[i] + '"' + (i === 0 ? " checked" : "") + '>' +
      '<span class="letter">' + LETTERS[i] + '</span><input type="text" class="o" placeholder="Option ' + LETTERS[i] + (i > 1 ? " (optional)" : "") + '" maxlength="400"></div>';
  }
  div.innerHTML = '<div class="qhead"><b class="qnum"></b><button type="button" class="btn danger sm rm">Remove</button></div>' +
    '<div class="field"><label>Question type</label><select class="qtype"><option value="mc">Multiple choice</option><option value="essay">Written question (student types an answer)</option></select></div>' +
    '<div class="field"><label>Question</label><textarea class="qt" maxlength="1000"></textarea></div>' +
    '<div class="mc-sec">' +
      '<div class="field"><span class="lbl">Options</span>' + opts + '<p class="hint">Select the circle next to the correct answer. Leave C and D empty for a two-option question.</p></div>' +
      '<div class="field"><label>Explanation (optional)</label><textarea class="ex" maxlength="1000" placeholder="Why this answer is correct"></textarea></div>' +
    '</div>' +
    '<div class="essay-sec" hidden>' +
      '<div class="field"><label>Marks for this question</label><input type="number" class="marks" min="1" max="100" step="1" placeholder="e.g. 4"></div>' +
      '<div class="field"><label>Picture (optional)</label><input type="file" class="pic" accept="image/*">' +
        '<img class="pic-prev" alt="Preview of the question picture" hidden style="max-width:100%;max-height:260px;border-radius:6px;border:1px solid var(--line)">' +
        '<div class="row"><button type="button" class="btn ghost sm pic-clear" hidden>Remove picture</button></div>' +
        '<p class="hint">Students see this picture with the question.</p></div>' +
      '<div class="field"><label>Mark scheme</label><textarea class="ms" maxlength="3000" placeholder="The model answer and how the marks are given. Students see this after they submit."></textarea></div>' +
    '</div>';
  $("questions").appendChild(div);
  var typeSel = div.querySelector(".qtype");
  typeSel.addEventListener("change", function () {
    var essay = typeSel.value === "essay";
    div.querySelector(".mc-sec").hidden = essay;
    div.querySelector(".essay-sec").hidden = !essay;
  });
  var pic = div.querySelector(".pic"), prev = div.querySelector(".pic-prev"), clearBtn = div.querySelector(".pic-clear");
  pic.addEventListener("change", function () {
    var f = pic.files && pic.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { setMsg("save-msg", "That file is not a picture. Choose a JPG, PNG or WebP image.", "bad"); pic.value = ""; return; }
    setMsg("save-msg", "Preparing the picture\u2026");
    shrink(f).then(function (d) {
      div._pending = d; div._imgId = "";
      prev.src = d; prev.hidden = false; clearBtn.hidden = false;
      setMsg("save-msg", "");
    }).catch(function () {
      setMsg("save-msg", "Could not read that picture. Try a smaller one.", "bad");
      pic.value = "";
    });
  });
  clearBtn.addEventListener("click", function () {
    div._pending = ""; div._imgId = ""; pic.value = "";
    prev.hidden = true; prev.removeAttribute("src"); clearBtn.hidden = true;
  });
  div.querySelector(".rm").addEventListener("click", function () {
    if ($("questions").children.length > 1) { div.remove(); renumber(); }
    else setMsg("save-msg", "A quiz needs at least one question.", "bad");
  });
  if (pre) fillQuestion(div, pre);
  renumber();
}
function fillQuestion(div, pre) {
  div.querySelector(".qt").value = pre.q || "";
  if (pre.t === "essay") {
    var sel = div.querySelector(".qtype");
    sel.value = "essay";
    sel.dispatchEvent(new Event("change"));
    div.querySelector(".marks").value = pre.marks || "";
    div.querySelector(".ms").value = pre.ms || "";
    if (pre.img) {
      div._imgId = pre.img;
      var prev = div.querySelector(".pic-prev"), clearBtn = div.querySelector(".pic-clear");
      var warn = function () { setMsg("save-msg", "A picture for one question did not load. It is kept when you save, unless you remove it.", "bad"); };
      api({ action: "image", id: pre.img }).then(function (j) {
        if (j && j.ok && typeof j.data === "string") { prev.src = j.data; prev.hidden = false; clearBtn.hidden = false; }
        else warn();
      }).catch(warn);
    }
    return;
  }
  var inputs = div.querySelectorAll(".o"), radios = div.querySelectorAll('input[type="radio"]');
  (pre.o || []).forEach(function (t, k) { if (inputs[k]) inputs[k].value = t; });
  if (radios[pre.a]) radios[pre.a].checked = true;
  div.querySelector(".ex").value = pre.e || "";
}
function startEdit(id) {
  setMsg("list-msg", "Loading quiz…");
  var load = id === "topic1"
    ? api({ action: "get", id: "topic1" }).then(function (j) { return j && j.ok && j.quiz ? j.quiz : BUILTIN_QUIZ; }).catch(function () { return BUILTIN_QUIZ; })
    : api({ action: "get", id: id }).then(function (j) { return j && j.ok && j.quiz ? j.quiz : null; });
  load.then(function (quiz) {
    if (!quiz || !quiz.questions || !quiz.questions.length) { setMsg("list-msg", "This quiz could not be loaded.", "bad"); return; }
    editing = { id: id };
    $("title").value = quiz.title;
    $("questions").innerHTML = "";
    qCount = 0;
    quiz.questions.forEach(function (item) { addQuestion(item); });
    $("editor-title").textContent = "Edit quiz";
    $("edit-label").textContent = "Editing: " + quiz.title;
    $("edit-banner").hidden = false;
    $("save").textContent = "Save changes";
    setMsg("list-msg", "");
    setMsg("save-msg", "");
    $("editor-title").scrollIntoView({ behavior: "smooth", block: "start" });
  }).catch(function () { setMsg("list-msg", "This quiz could not be loaded.", "bad"); });
}
function endEdit() {
  editing = null;
  $("title").value = "";
  $("questions").innerHTML = "";
  qCount = 0;
  addQuestion();
  $("editor-title").textContent = "Add a quiz";
  $("edit-banner").hidden = true;
  $("save").textContent = "Save quiz";
}
$("cancel-edit").addEventListener("click", function () { endEdit(); setMsg("save-msg", ""); });
/* Shrinks a picture so it fits the sheet cell limit. */
function shrink(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function () {
      var img = new Image();
      img.onerror = reject;
      img.onload = function () {
        var sizes = [1000, 800, 600], quals = [0.8, 0.7, 0.6];
        for (var s = 0; s < sizes.length; s++) {
          var scale = Math.min(1, sizes[s] / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * scale));
          c.height = Math.max(1, Math.round(img.height * scale));
          var ctx = c.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          for (var q = 0; q < quals.length; q++) {
            var d = c.toDataURL("image/jpeg", quals[q]);
            if (d.length <= 390000) { resolve(d); return; }
          }
        }
        reject(new Error("too large"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function waitForImage(iid, tries) {
  return new Promise(function (resolve) {
    var n = 0;
    (function poll() {
      api({ action: "image", id: iid }).then(function (j) {
        if (j && j.ok && typeof j.data === "string") { resolve(true); return; }
        if (++n >= tries) { resolve(false); return; }
        setTimeout(poll, 1800);
      }).catch(function () {
        if (++n >= tries) { resolve(false); return; }
        setTimeout(poll, 1800);
      });
    })();
  });
}
function uploadImage(data) {
  var iid = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  postForm({ action: "saveimage", pw: pw, id: iid, data: data });
  return waitForImage(iid, 8).then(function (ok) { return ok ? iid : ""; });
}
function renumber() {
  Array.prototype.forEach.call($("questions").children, function (el, i) { el.querySelector(".qnum").textContent = "Question " + (i + 1); });
}
$("add-q").addEventListener("click", function () {
  addQuestion();
  var last = $("questions").lastElementChild;
  last.querySelector(".qt").focus();
});

function collect() {
  var title = $("title").value.trim();
  if (!title) return { error: "Enter a quiz title.", focus: $("title") };
  var blocks = $("questions").children, questions = [];
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var q = b.querySelector(".qt").value.trim();
    if (!q) return { error: "Question " + (i + 1) + " has no question text.", focus: b.querySelector(".qt") };
    if (b.querySelector(".qtype").value === "essay") {
      var marks = parseInt(b.querySelector(".marks").value, 10);
      var ms = b.querySelector(".ms").value.trim();
      if (!(marks >= 1 && marks <= 100)) return { error: "Question " + (i + 1) + ": enter the marks (1 to 100).", focus: b.querySelector(".marks") };
      if (!ms) return { error: "Question " + (i + 1) + ": add the mark scheme.", focus: b.querySelector(".ms") };
      questions.push({ t: "essay", q: q, ms: ms, marks: marks, img: "" });
      continue;
    }
    var inputs = b.querySelectorAll(".o");
    var radios = b.querySelectorAll('input[type="radio"]');
    var correctRaw = 0;
    for (var r = 0; r < radios.length; r++) if (radios[r].checked) correctRaw = r;
    var o = [], a = -1;
    for (var k = 0; k < inputs.length; k++) {
      var t = inputs[k].value.trim();
      if (t) { if (k === correctRaw) a = o.length; o.push(t); }
    }
    if (o.length < 2) return { error: "Question " + (i + 1) + " needs at least two options.", focus: inputs[0] };
    if (a < 0) return { error: "Question " + (i + 1) + ": the correct answer is empty. Pick a filled option.", focus: inputs[correctRaw] };
    questions.push({ q: q, o: o, a: a, e: b.querySelector(".ex").value.trim() });
  }
  return { quiz: { title: title, questions: questions } };
}

/* Uploads any new pictures first, then saves the quiz with their ids. */
function attachPictures(questions) {
  var blocks = $("questions").children;
  var chain = Promise.resolve();
  questions.forEach(function (qq, i) {
    if (qq.t !== "essay") return;
    chain = chain.then(function () {
      var blk = blocks[i];
      if (blk._imgId) { qq.img = blk._imgId; return; }
      if (blk._pending) {
        return uploadImage(blk._pending).then(function (iid) {
          if (!iid) throw new Error("picture");
          blk._imgId = iid; blk._pending = "";
          qq.img = iid;
        });
      }
      qq.img = "";
    });
  });
  return chain;
}

$("save").addEventListener("click", function () {
  var res = collect();
  if (res.error) { setMsg("save-msg", res.error, "bad"); res.focus.focus(); return; }
  var id = editing ? editing.id : "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  var title = res.quiz.title, n = res.quiz.questions.length;
  var btn = $("save");
  btn.disabled = true;
  setMsg("save-msg", "Saving\u2026");
  attachPictures(res.quiz.questions).then(function () {
    postForm({ action: "save", pw: pw, id: id, quiz: res.quiz });
    return waitFor(function (list) { return list.some(function (q) { return q.id === id && q.title === title && q.count === n; }); }, 8);
  }).then(function (list) {
    btn.disabled = false;
    if (list) {
      if (editing) {
        setMsg("save-msg", "Changes saved. Students will see the update.", "good");
        endEdit();
      } else {
        setMsg("save-msg", "Saved. Students will see \u201c" + title + "\u201d in the quiz list.", "good");
        $("title").value = "";
        $("questions").innerHTML = "";
        qCount = 0;
        addQuestion();
      }
      renderList(list);
    } else {
      setMsg("save-msg", "The quiz could not be confirmed. Reload the list below and check it. If it did not change, check the script password and that you deployed a new version.", "bad");
    }
  }).catch(function (err) {
    btn.disabled = false;
    if (err && err.message === "picture") setMsg("save-msg", "A picture could not be saved. Remove it or try a smaller one, then save again.", "bad");
    else setMsg("save-msg", "Something went wrong while saving. Try again.", "bad");
  });
});

/* saved quizzes */
function renderList(list) {
  var t1 = list.filter(function (q) { return q.id === "topic1"; })[0];
  var others = list.filter(function (q) { return q.id !== "topic1"; });
  var t1Title = t1 ? t1.title : BUILTIN_QUIZ.title;
  var t1Count = t1 ? t1.count : BUILTIN_QUIZ.questions.length;
  var html = '<div class="qrow"><div><b>' + esc(t1Title) + '</b><small>' + (t1 ? "Edited" : "Original") + " · " + esc(t1Count) + ' questions</small></div>' +
    '<div class="row"><button type="button" class="btn sm edit" data-id="topic1">Edit</button>' +
    (t1 ? '<button type="button" class="btn danger sm del" data-id="topic1" data-label="Reset">Reset</button>' : '') + '</div></div>';
  html += others.map(function (q) {
    return '<div class="qrow"><div><b>' + esc(q.title) + '</b><small>' + esc(q.count) + ' questions</small></div>' +
      '<div class="row"><button type="button" class="btn ghost sm edit" data-id="' + esc(q.id) + '">Edit</button>' +
      '<button type="button" class="btn danger sm del" data-id="' + esc(q.id) + '" data-label="Delete">Delete</button></div></div>';
  }).join("");
  if (!others.length) html += '<p class="msg">No other quizzes added yet.</p>';
  $("list").innerHTML = html;
}
function refreshList() {
  setMsg("list-msg", "");
  api({ action: "list" }).then(function (j) {
    if (j && j.ok) renderList(j.quizzes); else setMsg("list-msg", "Could not load the list.", "bad");
  }).catch(function () { setMsg("list-msg", "Could not load the list.", "bad"); });
}
$("list").addEventListener("click", function (ev) {
  var editBtn = ev.target.closest ? ev.target.closest(".edit") : null;
  if (editBtn) { startEdit(editBtn.getAttribute("data-id")); return; }
  var btn = ev.target.closest ? ev.target.closest(".del") : null;
  if (!btn) return;
  var label = btn.getAttribute("data-label") || "Delete";
  if (!btn.dataset.armed) {
    btn.dataset.armed = "1";
    btn.textContent = "Click again to confirm";
    setTimeout(function () { btn.dataset.armed = ""; btn.textContent = label; }, 4000);
    return;
  }
  var id = btn.getAttribute("data-id");
  btn.disabled = true;
  setMsg("list-msg", "Working…");
  postForm({ action: "delete", pw: pw, id: id });
  waitFor(function (list) { return !list.some(function (q) { return q.id === id; }); }, 8).then(function (list) {
    if (list) {
      if (editing && editing.id === id) endEdit();
      renderList(list);
      setMsg("list-msg", label === "Reset" ? "Reset to the original Topic 1 quiz." : "Deleted.", "good");
    } else { btn.disabled = false; setMsg("list-msg", "Could not confirm the change. Reload and check.", "bad"); }
  });
});

try {
  var saved = sessionStorage.getItem("bn_admin_pw");
  if (saved) { $("pw").value = saved; signIn(); }
} catch (e) {}
</script>
